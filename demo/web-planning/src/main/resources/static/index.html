<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <title>Planning de soirée – Démo Web</title>
    <style>
        :root {
            color-scheme: light;
            font-family: 'Inter', Arial, sans-serif;
        }
        body { margin: 0; background: #f3f4f6; padding: 2rem; }
        h1 { color: #111827; margin-bottom: .5rem; }
        p { color: #4b5563; }
        textarea { width: 100%; min-height: 70px; padding: .75rem; border-radius: 8px; border: 1px solid #d1d5db; background: #fff; }
        button { margin-top: 1rem; padding: .6rem 1.4rem; font-size: 1rem; border-radius: 999px; border: none; background: linear-gradient(135deg, #6366f1, #8b5cf6); color: #fff; cursor: pointer; }
        button:hover { filter: brightness(0.95); }
        .layout { display: grid; grid-template-columns: 2fr 1fr; gap: 1.5rem; }
        .panel { background: #fff; border-radius: 16px; box-shadow: 0 16px 40px rgba(15, 23, 42, 0.08); padding: 1.5rem; }
        .result-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 1rem; margin-top: 1.5rem; }
        .card { border-radius: 14px; padding: 1.2rem; background: linear-gradient(135deg, #1d4ed8, #2563eb); color: #fff; position: relative; overflow: hidden; }
        .card.secondary { background: linear-gradient(135deg, #059669, #10b981); }
        .card h2 { margin: 0 0 .5rem 0; font-size: 1.2rem; }
        .chip { background: rgba(255,255,255,0.2); display: inline-block; padding: .2rem .6rem; border-radius: 999px; font-size: .75rem; margin-right: .4rem; }
        .assignment { margin-top: .8rem; }
        .assignment div { margin: .25rem 0; display: flex; justify-content: space-between; }
        .assignment span { font-weight: 600; }
        .history { list-style: none; padding: 0; margin: 0; }
        .history li { background: #fff; padding: 1rem; border-radius: 12px; margin-bottom: .8rem; box-shadow: 0 6px 12px rgba(15,23,42,0.08); }
        .meter { height: 8px; background: rgba(255,255,255,0.3); border-radius: 999px; margin-top: .5rem; overflow: hidden; }
        .meter span { display: block; height: 100%; background: rgba(255,255,255,0.9); }
        .error { color: #b91c1c; font-weight: bold; }
        @media(max-width: 960px) { .layout { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <h1>Planifier la soirée</h1>
    <p>Modifiez les champs pour tester d'autres scénarios (laissez vide pour jouer avec le dataset par défaut).</p>
    <div class="layout">
        <div class="panel">
            <label>Amis</label>
            <textarea id="friends" placeholder="Alice, Bruno, Chloé, David"></textarea>
            <label style="margin-top:1rem;">Activités</label>
            <textarea id="activities" placeholder="Cinéma, Escape Game, Restaurant, Karaoké"></textarea>
            <button id="submit">Calculer</button>
            <div id="result" style="margin-top:1.5rem;"></div>
        </div>
        <div class="panel">
            <h2 style="margin-top:0;">Historique</h2>
            <ul id="history" class="history"></ul>
        </div>
    </div>

    <script>
        const history = [];
        const historyList = document.getElementById('history');

        document.getElementById('submit').addEventListener('click', async () => {
            const friendsInput = document.getElementById('friends').value.trim();
            const activitiesInput = document.getElementById('activities').value.trim();

            const friends = friendsInput ? friendsInput.split(',').map(v => v.trim()).filter(Boolean) : [];
            const activities = activitiesInput ? activitiesInput.split(',').map(v => v.trim()).filter(Boolean) : [];

            const payload = { friends, activities };
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '<p>Calcul en cours…</p>';

            try {
                const response = await fetch('/planifier', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await response.json();

                if (data.status === 'ok') {
                    displayResults(data);
                    addToHistory(data);
                } else if (data.status === 'no_solution') {
                    resultDiv.innerHTML = '<p class="error">Aucune solution trouvée</p>';
                } else {
                    resultDiv.innerHTML = `<p class="error">${data.message || 'Erreur inattendue'}</p>`;
                }
            } catch (error) {
                resultDiv.innerHTML = `<p class="error">Erreur : ${error}</p>`;
            }
        });

        function displayResults(data) {
            const resultDiv = document.getElementById('result');
            const min = data.minCost;
            const balanced = data.balanced;
            resultDiv.innerHTML = `
                <div class="result-grid">
                    ${renderCard('Objectif coût minimal', min, '#38bdf8')}
                    ${balanced ? renderCard('Objectif équilibre', balanced, '#f97316') : ''}
                </div>
            `;
        }

        function renderCard(title, payload, accentColor) {
            const assignmentHtml = Object.entries(payload.assignment)
                .map(([friend, activity]) => `<div><span>${friend}</span><span>${activity}</span></div>`)
                .join('');
            const nodes = payload.nodes;
            const width = Math.min(100, nodes / 50);
            return `
                <div class="card" style="background:${accentColor};">
                    <span class="chip">${payload.solutions} solutions</span>
                    <h2>${title}</h2>
                    <p style="margin:0;">Coût : <strong>${payload.cost}</strong></p>
                    <p style="margin:0;">Nœuds explorés : ${nodes}</p>
                    <div class="meter"><span style="width:${width}%"></span></div>
                    <div class="assignment">${assignmentHtml}</div>
                </div>
            `;
        }

        function addToHistory(data) {
            const timestamp = new Date().toLocaleTimeString();
            history.unshift({ timestamp, minCost: data.minCost });
            if (history.length > 5) history.pop();

            historyList.innerHTML = history
                .map(entry => `
                    <li>
                        <strong>${entry.timestamp}</strong><br/>
                        Coût minimal : ${entry.minCost.cost} – Nœuds : ${entry.minCost.nodes}
                    </li>
                `)
                .join('');
        }
    </script>
</body>
</html>
